<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="100%" height="100%">
  <style>
    .luxury {
      font-family: 'Times New Roman', Times, serif, sans-serif;
      font-size: 52px;
      font-weight: bold;
      fill: #a8853f;
      letter-spacing: 6px;
    }
    .chantes {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 44px;
      font-weight: 900;
      fill: #1b1917;
      letter-spacing: 3px;
    }
    .sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #a8853f;
      letter-spacing: 4px;
    }
  </style>

  <!-- Fondo transparente o sutil para el logo -->
  <rect width="450" height="140" fill="transparent" rx="8" />

  <!-- Texto Principal: LUXURY CHANTES -->
  <text x="25" y="55" class="luxury">LUXURY</text>
  <text x="25" y="102" class="chantes">CHANTES</text>

  <!-- Subtítulo inferior -->
  <text x="27" y="124" class="sub">COSTA RICA EXCLUSIVE URBAN HOMES</text>
</svg>